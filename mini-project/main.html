<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width" initial-scale="1.0">
        <title>Student Registration form</title>
    </head>
    <body>
        <form id="studentForm">
            <input type="hidden" id="student_id" name="student_id">
                <label for="name">Name:
                    <input type="text" id="username" autocomplete="off" name="username" placeholder="Enter your name" required>
                </label><br><br>
                <label for="age">Age:
                    <input type="number" id="age" placeholder="Enter your age"  required>
                </label><br><br>
                <label for="email">Email:
                    <input type="text" id="email" autocomplete="off" name="email" placeholder="Enter your email" required>
                </label><br><br>
                <label for="course">Course:
                    <input type="text" id="course" autocomplete="off" name="course" placeholder="Enter course name" required>
                </label><br><br>
            <button type="submit" >
                Submit
            </button>
        </form>
    </body>
    <script src="main.js"></script>
    <h2 style="text-align: center;">Student Registration form</h2>
    <table style="margin-left: 30%;">
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Age</th>
                <th>Email</th>
                <th>Course</th>
                <th>Edit</th>
            </tr>
        </thead>
        <tbody id="studentTable">  
            <tr>
                <td>{{student.id}}</td>
                <td>{{student.name}}</td>
                <td>{{student.age}}</td>
                <td>{{student.email}}</td>
                <td>{{student.course}}</td>
                <td><button id="edit_{{student.id}}" class="edit">Edit</button>
                <button id="delete_{{student.id}}" class="delete" >Delete</button></td>
            </tr>
        </tbody>          
</html>
